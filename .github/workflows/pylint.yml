name: Python Quality Check

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch all history so pylint can use git ls-files
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint black
          # Install app dependencies so Pylint can verify imports
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fix Formatting (Black)
        run: black .

      - name: Run Unit Tests
        run: python -m unittest test_tracker.py

      - name: Run Pylint to Verify Quality
        run: pylint $(git ls-files '*.py')

      - name: Commit Fixed Code
        # Only commits if Black made changes to formatting
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format and fix linting issues"
